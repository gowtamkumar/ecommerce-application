services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    # restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: gowtampaul1995@
      POSTGRES_DB: ecommerce_db
      TZ: "GMT"
      PGTZ: "GMT"
    ports:
      - "5549:5432" # external:internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main_network
    mem_limit: 256m
    cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin_ecommerce
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=gowtampaul0@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=gowtampaul1995@
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - main_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: server_app
    env_file:
      - ./server/.env.development
    ports:
      - "3900:3900"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - main_network
    mem_limit: 768m
    cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client_app
    ports:
      - "3100:3100"
    env_file:
      - ./client/.env.local
    environment:
      - NODE_OPTIONS=--max-old-space-size=2560
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
    networks:
      - main_network
    mem_limit: 3g
    cpus: '2.0'

networks:
  main_network:
    driver: bridge

volumes:
  postgres_data:
