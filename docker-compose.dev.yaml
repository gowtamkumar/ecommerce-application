services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    # restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: gowtampaul1995@
      POSTGRES_DB: ecommerce_db
      TZ: "GMT"
      PGTZ: "GMT"
    ports:
      - "5549:5432" # external:internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main_network
    mem_limit: 256m
    cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin_ecommerce
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=gowtampaul0@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=gowtampaul1995@
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - main_network

  # ============ MINIO (S3-compatible object storage) ============
  minio:
    image: minio/minio:latest
    container_name: minio_ecommerce
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin@ecommerce1995}
      MINIO_UPDATE: "off"
    ports:
      - "9010:9000" # S3 API (public/external) -> container 9000
      - "9011:9001" # Web Console (public/external) -> container 9001
    volumes:
      - minio_data:/data
    networks:
      - main_network
    mem_limit: 512m
    cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: create bucket + make it public so objects get a public URL
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio_init_ecommerce
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin@ecommerce1995}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/ecommerce &&
      mc anonymous set download local/ecommerce &&
      echo 'MinIO bucket \"ecommerce\" is ready and PUBLIC.'
      "
    networks:
      - main_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: server_app
    env_file:
      - ./server/.env.development
    ports:
      - "3900:3900"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - main_network
    mem_limit: 768m
    cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client_app
    ports:
      - "3100:3100"
    env_file:
      - ./client/.env.local
    environment:
      - NODE_OPTIONS=--max-old-space-size=2560
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
    networks:
      - main_network
    mem_limit: 3g
    cpus: '2.0'

networks:
  main_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
