services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce_postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: gowtampaul1995@
      POSTGRES_DB: ecommerce_db
      TZ: "GMT"
      PGTZ: "GMT"
    ports:
      - "5544:5432" # external:internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - main_network

  pgadmin:
    container_name: ecommerce_pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=gowtampaul0@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=gowtampaul1995@
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - main_network

  # ============ MINIO (S3-compatible object storage) ============
  minio:
    image: minio/minio:latest
    container_name: minio_ecommerce_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin@ecommerce1995}
      MINIO_UPDATE: "off"
    ports:
      - "9010:9000" # S3 API (public/external) -> container 9000
      - "9011:9001" # Web Console (public/external) -> container 9001
    volumes:
      - minio_data:/data
    networks:
      - main_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job: create bucket + make it public so objects get a public URL
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio_init_ecommerce_prod
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin@ecommerce1995}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/ecommerce &&
      mc anonymous set download local/ecommerce &&
      echo 'MinIO bucket \"ecommerce\" is ready and PUBLIC.'
      "
    networks:
      - main_network

  server:
    build:
      context: ./server
      dockerfile: dockerfile.prod
    container_name: ecommerce_server_app
    restart: always
    env_file:
      - ./server/.env.production
    ports:
      - "4400:4400"
    volumes:
      - ./server/public/uploads:/app/public/uploads
      # - ./server:/app
    depends_on:
      - postgres
      - minio-init
    networks:
      - main_network
  client:
    build:
      context: ./client
      dockerfile: dockerfile.prod
    container_name: ecommerce_client_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
    environment:
      - NEXTAUTH_TRUST_HOST=true
    # expose:
    #   - "80"
    depends_on:
      - server
    networks:
      - main_network

  nginx:
    image: nginx:latest
    container_name: ecommerce_nginx_proxy
    restart: always
    ports:
      - "80:80"
    # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server/public/uploads:/app/public/uploads
    # - ./nginx/certbot/conf:/etc/letsencrypt
    # - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - client
      - server
    networks:
      - main_network

# certbot:
